version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: lab-test-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: lab-test-analyzer
    volumes:
      - mongo_data:/data/db
    networks:
      - lab-test-network

  redis:
    image: redis:7-alpine
    container_name: lab-test-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lab-test-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lab-test-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password@mongo:27017/lab-test-analyzer
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-jwt-secret
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo
      - redis
    networks:
      - lab-test-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lab-test-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_BASE_URL: http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - lab-test-network

volumes:
  mongo_data:
  redis_data:

networks:
  lab-test-network:
    driver: bridge
